<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicare+ | Login</title>
<style>
    :root {
        --primary: #1062fe;
        --primary-dark: #0d52d1;
        --primary-light: #eef4ff;
        --doctor: #10b981;
        --doctor-dark: #059669;
        --doctor-light: #ecfdf5;
        --admin: #7c3aed;
        --admin-dark: #6d28d9;
        --admin-light: #f3ebff;
        --danger: #ef4444;
        --danger-light: #fef2f2;
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --bg: #f6f8fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .site-header { width: 100%; background: #fff; border-bottom: 1px solid var(--border-color); }
    .header-inner { max-width: 1120px; margin: 0 auto; padding: 16px 24px; }
    .logo { font-size: 21px; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 6px; }
    .logo span.tag { font-size: 10.5px; font-weight: 700; color: var(--primary); background: var(--primary-light); padding: 3px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .3px; }

    .wrap { width: 100%; max-width: 460px; margin: 40px auto; padding: 0 20px 60px 20px; flex-grow: 1; }
    .intro { text-align: center; margin-bottom: 26px; }
    .intro h1 { font-size: 22px; margin-bottom: 6px; }
    .intro p { color: var(--text-muted); font-size: 13.5px; }

    .role-tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 22px; background: #fff; padding: 6px; border-radius: 14px; border: 1px solid var(--border-color); }
    .role-tab { border: none; background: transparent; padding: 12px 6px; border-radius: 10px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .role-tab .ic { font-size: 18px; }
    .role-tab.active { color: #fff; }
    .role-tab[data-role="patient"].active { background: var(--primary); }
    .role-tab[data-role="doctor"].active { background: var(--doctor); }
    .role-tab[data-role="admin"].active { background: var(--admin); }

    .card { background: #fff; border-radius: 16px; padding: 26px; border: 1px solid var(--border-color); }
    .role-banner { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    .role-banner.patient { background: var(--primary-light); color: var(--primary-dark); }
    .role-banner.doctor { background: var(--doctor-light); color: var(--doctor-dark); }
    .role-banner.admin { background: var(--admin-light); color: var(--admin-dark); }

    .form-label { font-size: 12.5px; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; display: block; }
    .form-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; background: #fbfcfe; outline: none; font-family: inherit; }
    .form-input:focus { border-color: var(--primary); background: #fff; }
    .form-field { margin-bottom: 16px; }

    .btn-login { width: 100%; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; padding: 13px 20px; color: #fff; margin-top: 4px; }
    .btn-login[data-role="patient"] { background: var(--primary); }
    .btn-login[data-role="patient"]:hover { background: var(--primary-dark); }
    .btn-login[data-role="doctor"] { background: var(--doctor); }
    .btn-login[data-role="doctor"]:hover { background: var(--doctor-dark); }
    .btn-login[data-role="admin"] { background: var(--admin); }
    .btn-login[data-role="admin"]:hover { background: var(--admin-dark); }

    .error-box { background: var(--danger-light); color: var(--danger); font-size: 13px; font-weight: 600; padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
    .error-box.show { display: block; }

    .demo-box { margin-top: 20px; background: var(--bg); border: 1px dashed var(--border-color); border-radius: 10px; padding: 14px; font-size: 12.5px; }
    .demo-box .dtitle { font-weight: 700; margin-bottom: 8px; color: var(--text-dark); }
    .demo-row { display: flex; justify-content: space-between; padding: 4px 0; color: var(--text-muted); }
    .demo-row b { color: var(--text-dark); font-family: monospace; }
    .fill-btn { margin-top: 10px; width: 100%; background: #fff; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--text-dark); }
    .fill-btn:hover { border-color: var(--primary); color: var(--primary-dark); }

    .site-footer { text-align: center; font-size: 12px; color: var(--text-muted); padding: 18px; }

    /* ---------- Portal frame view ---------- */
    #portal-view { display: none; position: fixed; inset: 0; z-index: 500; background: #fff; }
    #portal-view.show { display: block; }
    #portal-frame { width: 100%; height: 100%; border: none; }
    #switch-btn { position: fixed; bottom: 18px; right: 18px; z-index: 600; background: var(--text-dark); color: #fff; border: none; border-radius: 999px; padding: 11px 18px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.25); display: none; }
    #switch-btn.show { display: block; }
</style>
</head>
<body>

<div id="login-view">
    <div class="site-header">
        <div class="header-inner">
            <div class="logo">Medicare+ <span class="tag">Login Hub</span></div>
        </div>
    </div>

    <div class="wrap">
        <div class="intro">
            <h1>Welcome to Medicare+</h1>
            <p>Choose your portal and sign in to continue</p>
        </div>

        <div class="role-tabs">
            <button class="role-tab" data-role="patient" onclick="selectRole('patient')">
                <span class="ic">P</span>Patient
            </button>
            <button class="role-tab" data-role="doctor" onclick="selectRole('doctor')">
                <span class="ic">D</span>Doctor
            </button>
            <button class="role-tab" data-role="admin" onclick="selectRole('admin')">
                <span class="ic">A</span>Admin
            </button>
        </div>

        <div class="card">
            <div id="role-banner"></div>
            <div id="error-box" class="error-box"></div>

            <div class="form-field">
                <label class="form-label" id="id-label">Email / ID</label>
                <input class="form-input" id="inp-id" placeholder="Enter your ID">
            </div>
            <div class="form-field">
                <label class="form-label">Password</label>
                <input class="form-input" id="inp-pass" type="password" placeholder="Enter your password">
            </div>

            <button class="btn-login" id="login-btn" onclick="attemptLogin()">Sign In</button>

            <div class="demo-box">
                <div class="dtitle">Demo credentials for this portal</div>
                <div class="demo-row"><span>ID</span><b id="demo-id"></b></div>
                <div class="demo-row"><span>Password</span><b id="demo-pass"></b></div>
                <button class="fill-btn" onclick="autofill()">Autofill demo credentials</button>
            </div>
        </div>
    </div>

    <div class="site-footer">Medicare+ demo build &mdash; for prototyping purposes only.</div>
</div>

<div id="portal-view">
    <iframe id="portal-frame"></iframe>
</div>
<button id="switch-btn" onclick="backToLogin()">&larr; Switch Portal</button>

<!-- Embedded panel sources (base64) so the whole app is one file -->


<script>
    const CREDENTIALS = {
        patient: { id: "rahul@gmail.com",         pass: "patient123", label: "Patient", src: "patient.html" },
        doctor:  { id: "doctor@medicareplus.com", pass: "doctor123",  label: "Doctor",  src: "doctor.html"  },
        admin:   { id: "admin@medicareplus.com",  pass: "admin123",   label: "Admin",   src: "admin.html"   }
    };

    let currentRole = "patient";

    function selectRole(role) {
        currentRole = role;
        document.querySelectorAll(".role-tab").forEach(t => {
            t.classList.toggle("active", t.dataset.role === role);
        });

        const cred = CREDENTIALS[role];
        const banner = document.getElementById("role-banner");
        banner.className = "role-banner " + role;
        const labels = { patient: "Patient", doctor: "Doctor", admin: "Admin" };
        banner.innerHTML = "Signing in to the <b>" + labels[role] + " Portal</b>";

        document.getElementById("id-label").textContent = role === "doctor" ? "Doctor Email" : role === "admin" ? "Admin Email" : "Email / ID";
        document.getElementById("login-btn").dataset.role = role;
        document.getElementById("login-btn").textContent = "Sign In as " + cred.label;

        document.getElementById("demo-id").textContent = cred.id;
        document.getElementById("demo-pass").textContent = cred.pass;

        document.getElementById("error-box").classList.remove("show");
        document.getElementById("inp-id").value = "";
        document.getElementById("inp-pass").value = "";
    }

    function autofill() {
        const cred = CREDENTIALS[currentRole];
        document.getElementById("inp-id").value = cred.id;
        document.getElementById("inp-pass").value = cred.pass;
    }

    function b64DecodeUnicode(str) {
        return decodeURIComponent(atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
    }

    function attemptLogin() {
        const cred = CREDENTIALS[currentRole];
        const id = document.getElementById("inp-id").value.trim();
        const pass = document.getElementById("inp-pass").value;
        const errBox = document.getElementById("error-box");

        if (id === cred.id && pass === cred.pass) {
            errBox.classList.remove("show");
            loadPortal(cred.src);
        } else {
            errBox.textContent = "Incorrect ID or password for the " + cred.label + " portal. Use the demo credentials below.";
            errBox.classList.add("show");
        }
    }

    function loadPortal(src) {
        const frame = document.getElementById("portal-frame");
        frame.src = src;
        document.getElementById("login-view").style.display = "none";
        document.getElementById("portal-view").classList.add("show");
        document.getElementById("switch-btn").classList.add("show");
    }

    function backToLogin() {
        document.getElementById("portal-frame").src = "about:blank";
        document.getElementById("portal-view").classList.remove("show");
        document.getElementById("switch-btn").classList.remove("show");
        document.getElementById("login-view").style.display = "";
        selectRole(currentRole);
    }

    selectRole("patient");

    document.getElementById("inp-pass").addEventListener("keydown", e => {
        if (e.key === "Enter") attemptLogin();
    });
</script>

</body>
</html>
